<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ dark }}" hint-size="402px,874px">
  <div style="position: relative; height: 100%; box-sizing: border-box; background: {{ c.bg }}; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;">

    <div style="position: absolute; inset: 0; padding: 40px 20px; box-sizing: border-box; opacity: 0.5;">
      <div style="height: 100%; border-radius: 26px; background: {{ c.paper }};"></div>
    </div>
    <div style="position: absolute; inset: 0; background: rgba(10,9,8,0.35);"></div>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 64px; display: flex; flex-direction: column; border-radius: 38px 38px 0 0; background: {{ sheetBg }}; box-shadow: 0 -8px 40px rgba(0,0,0,0.18); padding: 10px 24px 0; box-sizing: border-box; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);">
      <div style="display: flex; justify-content: center; padding-bottom: 22px;">
        <div style="width: 36px; height: 5px; border-radius: 999px; background: {{ grabber }};"></div>
      </div>

      <div style="font-size: 34px; font-weight: 700; letter-spacing: -0.6px; color: {{ c.ink }};">Bilhete Pro</div>
      <div style="padding-top: 4px; font-size: 17px; color: {{ c.ink2 }}; letter-spacing: -0.24px;">Uma compra. Pra sempre.</div>

      <div style="display: flex; flex-direction: column; gap: 14px; padding: 28px 0 0;">
        <sc-for list="{{ capacidades }}" as="cap" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg width="18" height="18" viewBox="0 0 18 18" style="display: block; flex-shrink: 0;">
              <path d="M3.4 9.6l3.6 3.6 7.6-8.4" fill="none" stroke="{{ c.ink2 }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <span style="font-size: 17px; color: {{ c.ink }}; letter-spacing: -0.24px;">{{ cap }}</span>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{ semRede }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top: 26px; padding: 14px 16px; border-radius: 18px; background: {{ bannerBg }};">
          <div style="font-size: 15px; font-weight: 600; color: {{ c.ink }}; letter-spacing: -0.24px;">Sem conexão</div>
          <div style="margin-top: 3px; font-size: 13px; line-height: 18px; color: {{ c.ink2 }}; text-wrap: pretty;">Preciso de internet pra buscar o preço. Tente de novo daqui a pouco.</div>
        </div>
      </sc-if>

      <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-bottom: 46px;">
        <div style="width: 100%; height: 54px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 18px; background: {{ btnBg }}; opacity: {{ btnOpacity }};">
          <sc-if value="{{ btnSpinner }}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 20 20" style="display: block;">
              <circle cx="10" cy="10" r="8" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.4"></circle>
              <path d="M10 2a8 8 0 018 8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path>
            </svg>
          </sc-if>
          <sc-if value="{{ btnCheck }}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 20 20" style="display: block;">
              <path d="M4 10.6l4 4 8.4-9.2" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </sc-if>
          <sc-if value="{{ btnSkeleton }}" hint-placeholder-val="{{ false }}">
            <div style="width: 96px; height: 18px; border-radius: 999px; background: rgba(255,255,255,0.35);"></div>
          </sc-if>
          <sc-if value="{{ btnHasLabel }}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 17px; font-weight: 600; color: #FFFFFF; letter-spacing: -0.2px; font-variant-numeric: tabular-nums;">{{ btnLabel }}</span>
          </sc-if>
        </div>
        <span style="font-size: 15px; color: {{ c.ink2 }}; letter-spacing: -0.2px;">Restaurar compras</span>
        <div style="display: flex; align-items: center; gap: 14px; font-size: 12px; color: {{ c.ink2 }};">
          <span>Termos</span>
          <span style="width: 3px; height: 3px; border-radius: 999px; background: {{ c.ink2 }};"></span>
          <span>Privacidade</span>
        </div>
      </div>
    </div>
  </div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 402, &quot;height&quot;: 874}, &quot;dark&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;state&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;carregando&quot;, &quot;pronto&quot;, &quot;comprando&quot;, &quot;concluido&quot;, &quot;semRede&quot;], &quot;default&quot;: &quot;pronto&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const st = this.props.state || 'pronto';
    const c = dark ? {
      bg: '#121212', paper: '#1E1D1B', ink: '#F2EFE9', ink2: '#9C978D', hair: '#2C2A27',
      accent: '#E08A4C', bad: '#F2836A', ok: '#6FAE7E',
    } : {
      bg: '#F2EFE9', paper: '#FBF9F5', ink: '#1B1A18', ink2: '#6E6A62', hair: '#E3DED4',
      accent: '#C86A2E', bad: '#B3261E', ok: '#3E7C4F',
    };
    const semRede = st === 'semRede';
    const concluido = st === 'concluido';
    return {
      dark, c, semRede,
      capacidades: [
        'Bilhetes sem limite',
        'Arquivo sem limite, com busca',
        'Refixar pela tela de bloqueio, num toque',
        'Ei Siri, e Atalhos',
        'Escolher a fonte',
      ],
      sheetBg: dark ? 'rgba(30,29,27,0.96)' : 'rgba(251,249,245,0.97)',
      grabber: dark ? 'rgba(255,255,255,0.22)' : 'rgba(27,26,24,0.18)',
      bannerBg: dark ? 'rgba(255,255,255,0.06)' : 'rgba(27,26,24,0.05)',
      btnBg: concluido ? c.ok : c.accent,
      btnOpacity: semRede ? 0.4 : 1,
      btnSpinner: st === 'comprando',
      btnCheck: concluido,
      btnSkeleton: st === 'carregando',
      btnHasLabel: st === 'pronto' || semRede || concluido,
      btnLabel: concluido ? 'Bilhete Pro ✓' : 'R$ 29,90',
    };
  }
}
</script>
</body>
</html>
