# Projeto do Bilhete, gerado por XcodeGen (`xcodegen generate`).
# Estrutura conforme a seção 4.6 do spec, com as decisões D-1 (sem CloudKit)
# e D-2 (iPhone apenas) já aplicadas.

name: Bilhete

options:
  bundleIdPrefix: com.dablab
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Bilhete.xcconfig
  Release: Bilhete.xcconfig

settings:
  base:
    # iPhone apenas (D-2 / Q-5). 1 = iPhone.
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "6.0"
    # Padrões do Xcode 26: isolamento em MainActor por omissão, o que casa com
    # um app de UI onde SwiftData e SwiftUI vivem na main actor.
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_MODULE_VERIFIER: NO

packages:
  BilheteCore:
    path: Packages/BilheteCore

targets:
  # ─────────────────────────────────────────────────────────────────────────
  # Target principal. Todos os App Intents são linkados aqui (L14), via o
  # package BilheteCore, que a widget extension também usa — sem duplicar
  # arquivo entre targets (spec 18.3).
  # ─────────────────────────────────────────────────────────────────────────
  Bilhete:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: BilheteCore
      - target: BilheteWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: Bilhete
        # Repetido aqui de propósito, apesar de já estar no `settings.base` do
        # projeto: o XcodeGen escreve o padrão "1,2" do tipo de produto dentro
        # de cada target, e ajuste de target vence ajuste de projeto. Sem esta
        # linha o binário sai anunciando suporte a iPad, e a validação da App
        # Store recusa o envio exigindo as quatro orientações de multitarefa do
        # iPad — que este app não tem, por ser retrato e de iPhone (D-2).
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Bilhete.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # O ícone é declarado à mão porque o Info.plist é manual; sem isto a
        # App Store rejeita o binário.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandTerracota
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # A guarda da invariante 22.4 varre a pasta de modelos inteira, e a
        # lista de arquivos muda justamente quando alguém adiciona um modelo —
        # que é o caso que ela precisa pegar. Não dá para declarar isso como
        # input fixo de sandbox, então a sandbox de script fica desligada neste
        # target. O script só lê arquivos do próprio repositório.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: "Invariante 22.4 — proibido Array/Set em @Model"
        script: |
          "$SRCROOT/Scripts/check-no-model-collections.sh"
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false

  # ─────────────────────────────────────────────────────────────────────────
  # Widget extension: a Live Activity (S5–S8), os 4 widgets (S1–S4) e os
  # 2 Controles (S9, S10).
  # ─────────────────────────────────────────────────────────────────────────
  BilheteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - package: BilheteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).widgets
        PRODUCT_NAME: BilheteWidgets
        # Mesma razão do target principal: a extension é embarcada no app e
        # precisa declarar a mesma família de aparelho, senão o pacote fica
        # inconsistente na validação.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/BilheteWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandTerracota
        SKIP_INSTALL: YES

  BilheteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BilheteTests
      # Mesmo arquivo do esquema, referenciado (não copiado): o SKTestSession
      # procura a loja local dentro do bundle de teste.
      - path: Bilhete.storekit
    dependencies:
      - target: Bilhete
      - package: BilheteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  BilheteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BilheteUITests
      - path: Bilhete.storekit
    dependencies:
      - target: Bilhete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        # XCTestCase é nonisolated; o padrão MainActor do projeto conflita com
        # os inicializadores herdados.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Bilhete:
    build:
      targets:
        Bilhete: all
        BilheteWidgets: all
    run:
      config: Debug
      storeKitConfiguration: Bilhete.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BilheteTests
        - BilheteUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
